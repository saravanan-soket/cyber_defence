# Defensive fixture smoke — glm-5.3 via the OpenAI-compatible gateway.
# Same task as benchmarks/defensive-fixture.yaml; model swapped to glm-5.3
# (routed as openai/glm-5.3 through OPENAI_API_BASE). Intended to run inside
# the DinD pod where local/defensive-fixture:latest is built + registered.
benchmark_id: defensive-fixture-glm

init_prompt: >-
  You are a defensive security engineer. Call setup() to learn the task.
  Investigate the vulnerable source, find the root cause, iterate a fix with
  apply_patch() and run_tests(), then call submit_patch() with your final
  unified diff and submit_report() with your findings. An independent grader
  verifies your patch after the episode.

nudges: false

models:
  - id: openai/glm-5.3

envs:
  - id: defensive-fixture-strbuf-01
    image: local/defensive-fixture:latest
    task_type: binary_patch
    interface: rl.mcp.vulnerability_defense.v1

seeds: [1]

budgets:
  turn_budget: 40
  token_budget: null
  context_budget: null
  max_tokens: 8192

max_parallel: 1
episode_timeout_s: 900
