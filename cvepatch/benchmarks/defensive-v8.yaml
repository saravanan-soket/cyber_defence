# Defensive benchmark — V8 (scaling target).
#
# Same contract as benchmarks/defensive-fixture.yaml, pointed at a V8
# defensive env. Building the V8 image is a heavy operator step (~65-70 GB,
# full V8 toolchain + Docker daemon) handled by the V8 defensive builder,
# which reuses benchmarks/bench-v8/env-builder/bootstrap_v8.py. See
# docs/RUNBOOK.md for the build + registration procedure.
#
# Until a V8 defensive image is built and registered, use
# benchmarks/defensive-fixture.yaml for end-to-end validation — it exercises
# the identical runner + grader path on a fast synthetic task.
#
# Prereqs (operator):
#   # 1. build the V8 defensive image (reuses bench-v8 builder) — see runbook
#   # 2. author + validate the defensive task manifest for the chosen CVE
#   # 3. cvepatch register-defensive <v8 env_manifest.yaml>
#   # 4. cvepatch validate-image <env_id>   # confirms tool surface + manifest
benchmark_id: defensive-v8

init_prompt: >-
  Call setup() to learn the task. Investigate the vulnerable V8 source, find
  the root cause, develop a minimal patch with apply_patch() and validate it
  with run_tests(), then submit_patch() your final unified diff and
  submit_report() your findings. An independent grader builds and regression-
  tests your patch after the episode.

nudges: false

models:
  - id: anthropic/claude-opus-4-7
    params:
      thinking:
        type: adaptive
      output_config:
        effort: xhigh
      temperature: 1.0
  - id: openai/gpt-5.5
    params:
      reasoning_effort: xhigh

# Placeholder env — replace image with the digest produced by the V8
# defensive builder, and env_id with the registered catalog id. Kept as a
# single example so the config validates; add more V8 CVE envs as they are
# built + verified (see the ingestion -> build -> validate pipeline).
envs:
  - id: v8-defensive-cve-2024-4761
    image: local/v8-defensive:cve-2024-4761
    task_type: binary_patch
    interface: rl.mcp.vulnerability_defense.v1

seeds: [1, 2, 3]

budgets:
  # V8 defensive episodes need more turns than the fixture (large codebase to
  # navigate) but far fewer than the 300-turn exploit loop.
  turn_budget: 150
  token_budget: 2500000
  context_budget: 180000
  max_tokens: 16384

max_parallel: 1
# V8 builds/tests inside the grader are slow; give the cli_oneshot grader room
# (its own timeout is in the env manifest's evaluate.timeout_s).
episode_timeout_s: 3600
cost_cap_usd: 200.0
