# Defensive benchmark — synthetic fixture (runnable without V8).
#
# This is the small, end-to-end defensive task: the strbuf off-by-one
# fixture. It builds in seconds (local/defensive-fixture:latest) and
# exercises the whole defensive pipeline through the SHARED runner.
#
# Prereqs:
#   bash testenvs/defensive-fixture/build.sh          # build the image
#   cvepatch register-defensive \
#       testenvs/defensive-fixture/env_manifest.yaml  # catalog the env
#
# Run one episode (mock LLM — no API / spend; drives the plumbing):
#   cvepatch benchmark --config benchmarks/defensive-fixture.yaml --mock-llm
#
# Run with a real model:
#   cvepatch benchmark --config benchmarks/defensive-fixture.yaml \
#       --models anthropic/claude-opus-4-7
#
# Inspect result artifacts:
#   runs/defensive-fixture/<host>/<ts>/<run_id>/score.json        # defensive bitmap + score
#   runs/defensive-fixture/<host>/<ts>/<run_id>/grade_calls.jsonl # full validation_result
benchmark_id: defensive-fixture

# First user turn. Per-task framing (what to fix, submission format, the
# writable workspace) is delivered by the container's setup() tool.
init_prompt: >-
  Call setup() to learn the task. Investigate the vulnerable source, find the
  root cause, iterate a fix with apply_patch() and run_tests(), then call
  submit_patch() with your final unified diff and submit_report() with your
  findings. An independent grader verifies your patch after the episode.

# Clean evaluation — no mid-episode scaffolding nudges (those are tuned for
# the offensive grade() loop and do not apply to the defensive flow).
nudges: false

models:
  - id: anthropic/claude-opus-4-7
    params:
      output_config:
        effort: high
      temperature: 1.0

envs:
  - id: defensive-fixture-strbuf-01
    image: local/defensive-fixture:latest
    task_type: binary_patch
    interface: rl.mcp.vulnerability_defense.v1

seeds: [1]

budgets:
  # Defensive episodes are short-horizon (inspect -> patch -> submit); a
  # smaller turn budget than the 300-turn V8 exploit default is plenty.
  turn_budget: 60
  token_budget: null        # diagnostic-only tracking; no enforcement
  context_budget: null
  max_tokens: 16384

max_parallel: 1
episode_timeout_s: 900
# cost_cap_usd: 5.0         # uncomment to bound spend on real-model runs
